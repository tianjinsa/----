<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ed">
  <title>沿海，慢慢骑。— 鹈鹕的海岸日记</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f5ed;
      --ink: #294c49;
      --muted: #81918a;
      --line: #dce1d5;
      --orange: #d87a51;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; background: var(--paper); color: var(--ink); }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 3px solid var(--orange); outline-offset: 5px; }
    .page { width: min(1200px, calc(100% - 96px)); margin: 0 auto; padding: 29px 0 23px; }
    .masthead { display: flex; justify-content: space-between; align-items: center; padding-bottom: 23px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; gap: 12px; align-items: center; font-size: 11px; letter-spacing: 2.3px; font-weight: 650; }
    .brand svg { width: 36px; height: 29px; }
    .edition { color: var(--muted); font-size: 10px; letter-spacing: 2px; }
    .intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 29px 1px 26px; }
    .eyebrow { margin: 0 0 10px; color: var(--orange); font-size: 10px; font-weight: 600; letter-spacing: 3px; }
    h1 { margin: 0; font-family: "STSong", "SimSun", Georgia, serif; font-size: clamp(31px, 3.7vw, 48px); font-weight: 500; letter-spacing: 3px; line-height: 1.3; }
    .subtitle { margin: 12px 0 0; font-size: 12px; line-height: 1.9; color: #7a8a80; letter-spacing: 1px; }
    .weather { display: flex; gap: 12px; align-items: center; padding: 0 5px 5px 0; flex-shrink: 0; }
    .weather svg { width: 30px; height: 30px; color: var(--orange); }
    .weather strong { display: block; font-size: 12px; font-weight: 500; letter-spacing: 1px; }
    .weather small { display: block; margin-top: 5px; font-size: 9px; letter-spacing: 1.9px; color: var(--muted); }
    .scene-wrap { position: relative; overflow: hidden; border-radius: 20px; background: #e9efe3; isolation: isolate; }
    .scene { display: block; width: 100%; height: auto; }
    .scene-caption { position: absolute; left: 28px; top: 24px; display: flex; align-items: center; gap: 9px; font-size: 10px; letter-spacing: 2px; color: #688777; pointer-events: none; }
    .scene-caption::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #688777; }
    .scene-stamp { position: absolute; right: 28px; bottom: 23px; font-family: Georgia, serif; color: #9b9678; font-style: italic; font-size: 14px; letter-spacing: .5px; pointer-events: none; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 21px 0; border-bottom: 1px solid var(--line); }
    .playback { display: flex; align-items: center; gap: 14px; }
    .play { display: grid; place-items: center; flex: 0 0 auto; width: 43px; height: 43px; padding: 0; border: 0; border-radius: 50%; background: var(--ink); color: var(--paper); cursor: pointer; transition: background .2s, transform .2s; }
    .play:hover { background: #3d6660; transform: translateY(-2px); }
    .play svg { width: 16px; height: 16px; }
    .play .play-icon { display: none; }
    .play[data-paused="true"] .pause-icon { display: none; }
    .play[data-paused="true"] .play-icon { display: block; }
    .status { font-size: 12px; letter-spacing: 1px; }
    .key-hint { margin: 5px 0 0; color: var(--muted); font-size: 10px; letter-spacing: .6px; }
    .pace { display: flex; align-items: center; gap: 15px; }
    .pace-label { color: var(--muted); font-size: 10px; letter-spacing: 1px; }
    .speed-options { display: flex; gap: 4px; padding: 4px; background: #eaece2; border-radius: 30px; }
    .speed { min-width: 59px; padding: 8px 14px; border: 0; background: transparent; color: #7a8a80; border-radius: 20px; font-size: 11px; cursor: pointer; transition: background .2s, color .2s; }
    .speed[aria-pressed="true"] { color: var(--ink); background: #fffdf6; box-shadow: 0 1px 4px #294c4910; }
    .speed:hover { color: var(--ink); }
    .footer { display: flex; justify-content: space-between; gap: 15px; padding-top: 17px; color: #909b8e; font-size: 10px; letter-spacing: 1.1px; }
    .footer p { margin: 0; }
    .footer .english { font-size: 9px; letter-spacing: 2px; }
    @media (min-width: 1500px) { .page { padding-top: 36px; } .intro { padding-top: 36px; padding-bottom: 32px; } }
    @media (max-width: 680px) {
      .page { width: calc(100% - 36px); padding-top: 21px; }
      .masthead { padding-bottom: 18px; }
      .brand { font-size: 9px; letter-spacing: 1.5px; gap: 8px; }
      .edition { font-size: 8px; letter-spacing: 1px; }
      .intro { padding: 25px 0 22px; }
      .eyebrow { font-size: 8px; letter-spacing: 2px; }
      .subtitle { max-width: 230px; font-size: 10px; letter-spacing: .5px; }
      .weather { display: none; }
      .scene-wrap { border-radius: 14px; }
      .scene { width: 160%; max-width: none; margin-left: -30%; }
      .scene-caption { left: 16px; top: 16px; font-size: 8px; letter-spacing: 1px; }
      .scene-stamp { right: 15px; bottom: 16px; font-size: 11px; }
      .toolbar { gap: 12px; padding: 18px 0; }
      .playback { gap: 9px; }
      .play { width: 38px; height: 38px; }
      .status { font-size: 10px; letter-spacing: .5px; }
      .key-hint { font-size: 8px; }
      .pace { gap: 0; }
      .pace-label { display: none; }
      .speed { min-width: 42px; padding: 8px 10px; font-size: 10px; }
      .footer { font-size: 8px; letter-spacing: .4px; }
      .footer .english { font-size: 7px; letter-spacing: .8px; }
    }
    @media (max-width: 360px) { .speed { min-width: 35px; padding-inline: 8px; } .edition { display: none; } .footer .english { display: none; } }
    @media (prefers-reduced-motion: reduce) { button { transition: none !important; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div class="brand">
        <svg viewBox="0 0 42 32" fill="none" aria-hidden="true"><path d="M7 24C2 21 3 14 9 13C15 11 18 16 21 13L23 7C25 2 32 4 32 9L39 12L31 15C28 22 21 27 14 26Z" fill="currentColor"/><path d="M24 10L29 12L37 12L30 15Z" fill="#e8ad79"/><circle cx="28" cy="8" r="1.2" fill="#f6f5ed"/><path d="M8 29H32" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>THE SLOW COAST CLUB</span>

      <span class="edition">海岸日记 &nbsp; / &nbsp; NO. 001</span>
    </header>

    <section class="intro" aria-labelledby="heading">
      <div>
        <p class="eyebrow">A LITTLE RIDE, A LOT OF SUNSHINE</p>
        <h1 id="heading">沿海，慢慢骑。</h1>
        <p class="subtitle">一只鹈鹕，一辆单车，还有刚刚好的海风。</p>
      </div>
      <div class="weather" aria-label="晴朗，微风，宜兜风">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="16" cy="16" r="5.5"/><path d="M16 2V5M16 27V30M2 16H5M27 16H30M6 6L8 8M24 24L26 26M6 26L8 24M24 8L26 6"/></svg>
        <div><strong>晴 · 微风</strong><small>A GOOD DAY TO WANDER</small></div>
      </div>
    </section>

          <g id="wheelBase"><circle r="84" fill="#fffbed" fill-opacity=".3" stroke="#294845" stroke-width="10"/><circle r="76" fill="none" stroke="#fffbed" stroke-width="5"/><circle r="70" fill="none" stroke="#7a9990" stroke-width="1.3"/></g>

          <path d="M706 390L736 400M722 448L752 496" fill="none" stroke="#63816e" stroke-width="3"/>
          <g id="flowers">
            <path d="M762 410Q748 380 746 364M773 410Q776 389 785 380M765 410Q762 385 766 351" fill="none" stroke="#6f936e" stroke-width="3"/>
            <path d="M757 392Q737 381 739 373Q753 373 757 392M773 399Q788 386 795 391Q788 403 773 399M764 377Q755 364 752 369Q750 378 764 382" fill="#8ba878"/>
            <use href="#daisy" transform="translate(745 360) scale(.85)"/><use href="#daisy" transform="translate(787 377) scale(.65) rotate(13)"/><use href="#daisy" transform="translate(767 348) scale(.62) rotate(20)"/>
          </g>
          <path d="M718 398L730 450Q769 460 808 447L819 395Z" fill="#d9b67a" stroke="#9e885b" stroke-width="2.2"/>
          <path d="M732 399L740 451M746 398L752 453M760 398L763 453M774 398L774 453M788 397L785 451M803 397L797 449M724 411Q770 417 814 408M727 424Q770 431 811 421M729 438Q771 446 808 434" fill="none" stroke="#b1935f" stroke-width="1.6"/>
          <path d="M718 397Q765 403 819 395" fill="none" stroke="#ead09a" stroke-width="7"/>
          <path d="M718 394Q765 400 819 392" fill="none" stroke="#9e885b" stroke-width="2"/>
          <path d="M754 423Q762 417 771 423L768 437H758Z" fill="#efdab0" opacity=".85"/>
          <path d="M760 429H766" stroke="#a18e63" stroke-width="1.5"/>
        </g>
        <g id="butterfly" transform="translate(931 450)"><path id="butterflyWing" d="M0 0C-20-20-26 1-4 6C-16 20 0 21 2 8C13 21 25 8 7 4C28-8 11-21 0 0Z" fill="#d99066"/><path d="M0 0L5 10" stroke="#8a825e" stroke-width="2" stroke-linecap="round"/></g>
      </svg>
      <span class="scene-stamp">Life is better in the slow lane.</span>
    </section>

    <section class="toolbar" aria-label="动画控制">
      <div class="playback">
        <button class="play" id="playToggle" type="button" aria-label="暂停动画" data-paused="false">
          <svg class="pause-icon" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><rect x="4" y="3" width="3.5" height="12" rx="1"/><rect x="10.5" y="3" width="3.5" height="12" rx="1"/></svg>
          <svg class="play-icon" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><path d="M5 2.6Q5 1.8 5.9 2.4L15 8.3Q16 9 15 9.7L5.9 15.6Q5 16.2 5 15.4Z"/></svg>
        </button>
        <div><div class="status" id="status" role="status">海风正好，骑行中</div><p class="key-hint">按空格键，歇一小会儿</p></div>
      </div>
      <div class="pace">
        <span class="pace-label" id="paceLabel">骑行节奏</span>
        <div class="speed-options" role="group" aria-labelledby="paceLabel">
          <button class="speed" type="button" data-speed="0.6" aria-pressed="false" aria-label="悠闲，0.6 倍速">悠闲</button>
          <button class="speed" type="button" data-speed="1" aria-pressed="true" aria-label="轻快，正常速度">轻快</button>
          <button class="speed" type="button" data-speed="1.65" aria-pressed="false" aria-label="追风，1.65 倍速">追风</button>
        </div>
      </div>
    </section>
    <footer class="footer"><p>不赶时间，只追海风。</p><p class="english">NOWHERE TO BE. NOTHING TO RUSH.</p></footer>
  </main>
  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const refs = Object.fromEntries([
        'rearSpokes', 'frontSpokes', 'nearCrank', 'farCrank', 'nearLegPath',
        'nearLegHighlight', 'farLegPath', 'nearFoot', 'farFoot', 'chainring',
        'chain', 'pelican', 'rig', 'flowers', 'road', 'verge', 'waves', 'clouds',
        'gulls', 'sailboat', 'island', 'bikeShadow', 'breeze', 'eye',
        'scarfTailBack', 'scarfTailFront', 'butterfly', 'butterflyWing'
      ].map(id => [id, byId(id)]));
      const playToggle = byId('playToggle');
      const status = byId('status');
      const hint = document.querySelector('.key-hint');
      const speeds = Array.from(document.querySelectorAll('.speed'));
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let paused = motionPreference.matches;
      let speed = 1;
      let time = 0;
      let previousTime = null;
      let frameId = null;
      const set = (element, name, value) => element.setAttribute(name, value);
      const move = (element, value) => set(element, 'transform', value);
      const round = value => Number(value.toFixed(3));

      // Two-segment legs keep both feet planted on the moving pedals.
      function legPath(hipX, hipY, footX, footY) {
        const dx = footX - hipX;
        const dy = footY - hipY;
        const length = Math.hypot(dx, dy);
        const segment = 83;
        const bend = Math.sqrt(Math.max(0, segment * segment - length * length / 4));
        const kneeX = (hipX + footX) / 2 + dy / length * bend;
        const kneeY = (hipY + footY) / 2 - dx / length * bend;
        return `M${round(hipX)} ${round(hipY)}L${round(kneeX)} ${round(kneeY)}L${round(footX)} ${round(footY)}`;
      }

      function render(t) {
        const phase = t * 2.85;
        const angle = phase * 180 / Math.PI;
        const travel = t * 208;
        const wheelAngle = travel / 84 * 180 / Math.PI;
        const bob = Math.sin(phase * 2) * 1.7;
        const crankX = Math.cos(phase) * 34;
        const crankY = Math.sin(phase) * 34;
        const near = { x: 559 + crankX, y: 508 + crankY };
        const far = { x: 559 - crankX, y: 508 - crankY };
        move(refs.rearSpokes, `rotate(${round(wheelAngle)})`);
        move(refs.frontSpokes, `rotate(${round(wheelAngle)})`);
        move(refs.chainring, `rotate(${round(angle)} 559 508)`);
        set(refs.chain, 'stroke-dashoffset', round(-t * 32));
        set(refs.nearCrank, 'd', `M559 508L${round(near.x)} ${round(near.y)}`);
        set(refs.farCrank, 'd', `M559 508L${round(far.x)} ${round(far.y)}`);
        const nearPath = legPath(514, 392 + bob, near.x, near.y - 8);
        set(refs.nearLegPath, 'd', nearPath);
        set(refs.nearLegHighlight, 'd', nearPath);
        set(refs.farLegPath, 'd', legPath(536, 390 + bob, far.x, far.y - 8));
        move(refs.nearFoot, `translate(${round(near.x)} ${round(near.y - 9)})`);
        move(refs.farFoot, `translate(${round(far.x)} ${round(far.y - 9)})`);
        move(refs.pelican, `translate(0 ${round(bob)})`);
        move(refs.rig, `translate(0 ${round(Math.sin(phase * 2 + .7) * .65)})`);
        move(refs.flowers, `rotate(${round(Math.sin(t * 3.3) * 3.4)} 769 413)`);
        move(refs.road, `translate(${-round(travel % 1200)} 0)`);
        move(refs.verge, `translate(${-round((t * 91) % 1200)} 0)`);
        move(refs.waves, `translate(${-round((t * 19) % 1200)} ${round(Math.sin(t * .8) * 1.6)})`);
        move(refs.clouds, `translate(${round(Math.sin(t * .09) * 31)} ${round(Math.sin(t * .28) * 3)})`);
        move(refs.gulls, `translate(${round(Math.sin(t * .3) * 11)} ${round(Math.sin(t * 1.25) * 5)})`);
        move(refs.sailboat, `translate(${round(1240 - (t * 7 + 204) % 1320)} ${round(369 + Math.sin(t * 1.2) * 2)})`);
        move(refs.island, `translate(${round(1300 - (t * 3.5 + 1300) % 1600)} 0)`);
        set(refs.bikeShadow, 'rx', round(228 + Math.sin(phase * 2) * 3));
        set(refs.breeze, 'opacity', round(.36 + Math.sin(t * 2.8) * .18));
        const flap = Math.sin(t * 5) * 6;
        set(refs.scarfTailBack, 'd', `M576 285C552 282 532 ${round(254 + flap)} 506 ${round(266 + flap)}L519 ${round(279 + flap)}L506 ${round(283 + flap)}C536 ${round(291 + flap)} 550 309 578 299Z`);
        set(refs.scarfTailFront, 'd', `M575 285C550 279 524 ${round(280 - flap * .7)} 510 ${round(293 - flap * .7)}L524 ${round(298 - flap * .7)}L516 ${round(310 - flap * .7)}C544 ${round(309 - flap * .7)} 558 297 581 298Z`);
        const blinkTime = t % 5.3;
        const blink = blinkTime > 4.98 && blinkTime < 5.16 ? .13 : 1;
        move(refs.eye, `translate(616 221) scale(1 ${blink})`);
        const butterflyX = 931 + Math.sin(t * .72) * 45;
        const butterflyY = 443 + Math.sin(t * 1.8) * 16;
        move(refs.butterfly, `translate(${round(butterflyX)} ${round(butterflyY)}) rotate(${round(Math.sin(t * 1.3) * 13)}) scale(.68)`);
        move(refs.butterflyWing, `scale(${round(.4 + Math.abs(Math.cos(t * 10)) * .6)} 1)`);
      }

      function tick(now) {
        frameId = null;
        if (paused || document.hidden) { previousTime = null; return; }
        if (previousTime !== null) time += Math.min((now - previousTime) / 1000, .05) * speed;
        previousTime = now;
        render(time);
        frameId = requestAnimationFrame(tick);
      }

      function schedule() {
        if (!paused && !document.hidden && frameId === null) {
          previousTime = null;
          frameId = requestAnimationFrame(tick);
        }
      }

      function updatePlayback() {
        playToggle.dataset.paused = String(paused);
        playToggle.setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
        status.textContent = paused ? '歇一小会儿，看看海' : '海风正好，骑行中';
        hint.textContent = paused ? '按空格键，继续兜风' : '按空格键，歇一小会儿';
        if (paused && frameId !== null) {
          cancelAnimationFrame(frameId);
          frameId = null;
          previousTime = null;
        }
        schedule();
      }

      playToggle.addEventListener('click', () => { paused = !paused; updatePlayback(); });
      speeds.forEach(button => button.addEventListener('click', () => {
        speed = Number(button.dataset.speed);
        speeds.forEach(option => option.setAttribute('aria-pressed', String(option === button)));
      }));
      document.addEventListener('keydown', event => {
        if (event.code !== 'Space' || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.target.closest('button, input, textarea, select, a, [contenteditable="true"]')) return;
        event.preventDefault();
        paused = !paused;
        updatePlayback();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && frameId !== null) {
          cancelAnimationFrame(frameId);
          frameId = null;
        }
        previousTime = null;
        schedule();
      });
      motionPreference.addEventListener('change', event => {
        if (event.matches) { paused = true; updatePlayback(); }
      });
      render(0);
      updatePlayback();
    })();
  </script>
</body>
</html>
